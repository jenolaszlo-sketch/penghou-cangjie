name: Publish to NuGet
on:
  push:
    tags: ['v*-rc.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Resolve exact version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then version="${GITHUB_REF_NAME#v}"; else version="$(dotnet msbuild src/Penghou.Cangjie/Penghou.Cangjie.csproj -getProperty:PackageVersion)"; fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "$version" > version.txt
      - run: dotnet pack Penghou.Cangjie.slnx -c Release -o artifacts -p:Version=${{ env.PACKAGE_VERSION }} -p:PackageVersion=${{ env.PACKAGE_VERSION }}
      - name: Bind artifacts to source
        run: |
          git rev-parse HEAD > artifacts/source-commit.txt
          cp version.txt artifacts/version.txt
          sha256sum artifacts/*.nupkg artifacts/*.snupkg > artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: artifacts/
  qualify:
    needs: pack
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: artifacts
      - run: dotnet test Penghou.Cangjie.slnx -c Release
      - name: Exact artifact qualification
        shell: pwsh
        run: ./scripts/qualify-packages.ps1 -Version (Get-Content artifacts/version.txt) -PackageDirectory artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: qualification-${{ matrix.os }}
          path: artifacts/qualification/
  publish:
    needs: qualify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: artifacts
      - name: NuGet login (OIDC -> temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Verify source and artifact hashes before publication
        shell: bash
        run: |
          test "$(cat artifacts/source-commit.txt)" = "$GITHUB_SHA"
          sha256sum -c artifacts/SHA256SUMS
      - name: Publish exact qualified artifacts
        run: dotnet nuget push './artifacts/*.nupkg' --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate --no-symbols
      - name: Publish symbols
        run: dotnet nuget push './artifacts/*.snupkg' --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
      - name: Clean public package qualification
        shell: pwsh
        run: |
          $success = $false
          for ($attempt = 0; $attempt -lt 120; $attempt++) {
            try {
              ./scripts/qualify-packages.ps1 -Version (Get-Content artifacts/version.txt) -ReferencePackageDirectory artifacts
              $success = $true
              break
            } catch {
              if ($_.Exception.Message -notlike 'dotnet failed: restore*') { throw }
              Write-Warning 'Public packages are not yet restorable; artifact/payload mismatches are never retried.'
              if ($attempt -eq 119) { throw }
              Start-Sleep -Seconds 30
            }
          }
          if (-not $success) { throw 'Public package qualification failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: qualification-public
          path: artifacts/qualification/
