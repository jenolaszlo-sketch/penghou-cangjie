name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            package_version="${GITHUB_REF_NAME#v}"
          else
            package_version="$(dotnet msbuild \
              src/Penghou.Cangjie/Penghou.Cangjie.csproj \
              -getProperty:PackageVersion)"
          fi

          package_ids=(
            Penghou.Cangjie
            Penghou.Cangjie.Sqlite
            Penghou.Cangjie.Testing
          )

          for csproj in \
            src/Penghou.Cangjie/Penghou.Cangjie.csproj \
            src/Penghou.Cangjie.Sqlite/Penghou.Cangjie.Sqlite.csproj \
            src/Penghou.Cangjie.Testing/Penghou.Cangjie.Testing.csproj; do
            dotnet pack "$csproj" \
              --configuration Release \
              --output ./artifacts \
              --property:Version="$package_version" \
              --property:PackageVersion="$package_version"
          done

          for package_id in "${package_ids[@]}"; do
            test -f "./artifacts/$package_id.$package_version.nupkg"
            test -f "./artifacts/$package_id.$package_version.snupkg"
          done

      - name: NuGet login (OIDC -> temp API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages to NuGet
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --skip-duplicate

      - name: Push symbols to NuGet
        run: >
          dotnet nuget push ./artifacts/*.snupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --skip-duplicate
