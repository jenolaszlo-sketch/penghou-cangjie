name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Penghou.Cangjie.slnx
      - run: dotnet build Penghou.Cangjie.slnx -c Release --no-restore
      - run: dotnet format Penghou.Cangjie.slnx --verify-no-changes --no-restore
      - run: dotnet test Penghou.Cangjie.slnx -c Release --no-build --no-restore
      - run: dotnet pack Penghou.Cangjie.slnx -c Release --no-build --no-restore -o artifacts
      - shell: pwsh
        run: ./scripts/qualify-packages.ps1 -Version (dotnet msbuild src/Penghou.Cangjie/Penghou.Cangjie.csproj -getProperty:PackageVersion) -PackageDirectory artifacts
