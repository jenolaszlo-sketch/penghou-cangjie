name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Penghou.Cangjie.slnx
      - run: dotnet build Penghou.Cangjie.slnx -c Release --no-restore
      - run: dotnet test Penghou.Cangjie.slnx -c Release --no-build --no-restore
      - run: dotnet pack Penghou.Cangjie.slnx -c Release --no-build --no-restore -o artifacts
